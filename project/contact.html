    <h1>Contact Us</h1>
    

    <form method="get">
        <fieldset>
            <legend>Send us a message</legend>

            <label for="cname">*Name:  
                <input type="text" name="cname" id="cname" required>
            </label>

            <label for="email">*Email: 
                <input type="email" name="email" id="email" required>
            </label>

            <label for="written-inquiry">*Write your comments or questions here: 
                <textarea name="written-inquiry" id="written-inquiry" required></textarea>
            </label>
        </fieldset>

        <div class="form-actions">
            <button type="submit" class="submitBtn">Send comments</button>
        </div>
    </form>
