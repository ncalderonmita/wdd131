<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="This is an example page for a product review form page.">
    <meta name="author" content="Nicolas Calderon Mita">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk&display=swap" rel="stylesheet">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <form method="get" action="review.html">
        <fieldset>
            <legend>Product Name</legend>
            <label for="product-name" class="sr-only">Product Name</label>
            <select name="product" id="product-name" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Overall Rating</legend>
            <div class="stars">
                <input type="radio"  id="fivestar" name="stars" value="5" required><label for="fivestar"></label>
                <input type="radio"  id="fourstar" name="stars" value="4" required><label for="fourstar"></label>
                <input type="radio"  id="threestar" name="stars" value="3" required><label for="threestar"></label>
                <input type="radio"  id="twostar" name="stars" value="2" required><label for="twostar"></label>
                <input type="radio"  id="onestar" name="stars" value="1" required><label for="onestar"></label>
            </div>
        </fieldset>
        <fieldset>
            <legend>Date of Installation</legend>
            <label for="i-date" class="sr-only">Date of Installation</label>
            <input type="date" name="installation-date" id="i-date" required>
        </fieldset>

        <fieldset>
            <legend>Which features did you find useful in the product? (Check all that apply)</legend>
            <div class="checkbox-group">
                <input type="checkbox" name="durability" value="yes" id="durability">
                <label for="durability">Durability</label>

                <input type="checkbox" name="ease" value="yes" id="ease">
                <label for="ease">Ease of Use</label>

                <input type="checkbox" name="performance" value="yes" id="performance">
                <label for="performance">Performance</label>

                <input type="checkbox" name="design" value="yes" id="design">
                <label for="design">Design</label>
             </div>
        </fieldset>

        <fieldset>
            <legend>Written Review (Optional)</legend>
            <label for="written-review" class="sr-only">Written Review</label>
            <textarea id="written-review" name="written-review" aria-label="Written Review"></textarea>
        </fieldset>

        <fieldset>
            <legend>Your Name (Optional)</legend>
            <label for="cname" class="sr-only">Your Name</label>
            <input type="text" name="cname" id="cname">
        </fieldset>
        <div class="form-actions">
            <button type="submit" class="submitBtn">Submit Review</button>
        </div>
    </form>

    <footer>
        <p>©️<span id="currentyear"></span>👾 Nicolas Calderon 👾 Bolivia</p>
        <p><span id="lastModified"></span></p>
    </footer>
</body>
</html>
